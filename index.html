document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');

    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

ound:var(--glass-subtle);border-radius:10px;padding:10px 15px;font-size:13.5px;color:var(--ink2);min-height:42px\">Cancel<\u002Fbutton>\n<button sc-camel-on-click=\"{{ onFormSave }}\" style=\"border:0;background:#5F6488;color:#fff;border-radius:10px;padding:10px 18px;font-size:13.5px;font-weight:600;min-height:42px\">Save<\u002Fbutton>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsc-if>\n\n<sc-if value=\"{{ wtOpen }}\" hint-placeholder-val=\"{{ false }}\">\n<div style=\"position:fixed;left:22px;bottom:22px;z-index:65;width:min(380px,calc(100vw - 44px));background:var(--glass-strong);backdrop-filter:var(--blur-lg);-webkit-backdrop-filter:var(--blur-lg);border:1px solid var(--glass-border);border-radius:var(--radius-lg);box-shadow:var(--shadow-lift);overflow:hidden\">\n<div style=\"height:3px;background:var(--line)\"><div style=\"height:3px;background:linear-gradient(90deg,var(--coral),var(--deep));width:{{ wtPct }}\"><\u002Fdiv><\u002Fdiv>\n<div style=\"padding:18px 20px 20px\">\n<div style=\"display:flex;align-items:center;gap:10px\">\n<span style=\"font-size:11.5px;font-weight:700;letter-spacing:.13em;color:var(--deep)\">{{ wtTime }}<\u002Fspan>\n<span style=\"font-size:11.5px;color:var(--ink3);margin-left:auto\">{{ wtCounter }}<\u002Fspan>\n<button sc-camel-on-click=\"{{ wtExit }}\" title=\"End walkthrough\" style=\"border:0;background:transparent;color:var(--ink3);font-size:15px;line-height:1;padding:2px 4px\" style-hover=\"color:var(--deep)\">×<\u002Fbutton>\n<\u002Fdiv>\n<h3 style=\"margin:9px 0 6px;font-size:16.5px;font-weight:650;letter-spacing:-.2px\">{{ wtTitle }}<\u002Fh3>\n<p style=\"margin:0;font-size:13.5px;color:var(--ink2)\">{{ wtBody }}<\u002Fp>\n<sc-if value=\"{{ wtHasTip }}\" hint-placeholder-val=\"{{ false }}\">\n<p style=\"margin:10px 0 0;padding:10px 12px;background:var(--glass-subtle);border:1px solid var(--glass-border);border-radius:var(--radius-sm);font-size:12.5px;color:var(--ink2)\">{{ wtTip }}<\u002Fp>\n<\u002Fsc-if>\n<div style=\"display:flex;gap:8px;margin-top:16px\">\n<button sc-camel-on-click=\"{{ wtBack }}\" style=\"border:1px solid var(--glass-border);background:var(--glass-subtle);border-radius:10px;padding:9px 13px;font-size:13px;color:var(--ink2);min-height:40px\" style-hover=\"background:var(--glass-strong)\">Back<\u002Fbutton>\n<button sc-camel-on-click=\"{{ wtNext }}\" style=\"margin-left:auto;border:0;background:#5F6488;color:#fff;border-radius:10px;padding:9px 18px;font-size:13.5px;font-weight:600;min-height:40px;box-shadow:0 8px 20px var(--glow)\" style-hover=\"filter:brightness(1.05)\">{{ wtNextLabel }}<\u002Fbutton>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsc-if>\n\n<sc-if value=\"{{ hasToast }}\" hint-placeholder-val=\"{{ false }}\">\n<div style=\"position:fixed;right:22px;bottom:22px;z-index:70;padding:12px 18px;background:var(--glass-strong);backdrop-filter:var(--blur-lg);-webkit-backdrop-filter:var(--blur-lg);border:1px solid var(--glass-border);border-radius:12px;box-shadow:var(--shadow-lift);font-size:13.5px\">{{ toast }}<\u002Fdiv>\n<\u002Fsc-if>\n\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;greetingName&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Sierra&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Content&quot;},&quot;showIntelligence&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Layout&quot;},&quot;nextCount&quot;:{&quot;editor&quot;:&quot;int&quot;,&quot;default&quot;:2,&quot;min&quot;:1,&quot;max&quot;:3,&quot;tsType&quot;:&quot;number&quot;,&quot;section&quot;:&quot;Layout&quot;}}\">\nclass Component extends DCLogic {\n  KEY = 'sierra-executive-os-v3';\n  iso = () => new Date().toISOString().slice(0, 10);\n  uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);\n\n  seed() {\n    const d = this.iso(), u = this.uid;\n    return {version:1,theme:'light',lastOpened:d,streak:1,lastCleared:'',morningDate:'',pushDate:'',\n      settings:{apiKey:'',model:'gpt-4.1-mini',endpoint:'https://api.openai.com/v1/responses'},\n      push:{primary:'',secondary:'',next:''},\n      projects:[],\n      tasks:[],\n      decisions:[],\n      notes:[],\n      journal:[],checkins:{},archive:[],\n      chats:[{role:'ai',text:'I am here. Ask what to do next, what you might be missing, or paste a brain dump and I will help sort it.'}]};\n  }\n\n  load() {\n    let s = null;\n    try { s = JSON.parse(localStorage.getItem(this.KEY)); } catch (e) { s = null; }\n    if (!s || !s.tasks || !s.projects) s = this.seed();\n    s.settings = s.settings || {};\n    s.checkins = s.checkins || {};\n    s.chats = s.chats || [];\n    s.archive = s.archive || [];\n    s.journal = s.journal || [];\n    s.notes = s.notes || [];\n    s.decisions = s.decisions || [];\n    s.push = s.push || {primary:'',secondary:'',next:''};\n    const today = this.iso();\n    if (s.lastOpened !== today) {\n      const diff = Math.round((new Date(today) - new Date(s.lastOpened || today)) / 86400000);\n      s.streak = diff === 1 ? (s.streak || 0) + 1 : 1;\n      s.lastOpened = today;\n    }\n    return s;\n  }\n\n  state = {\n    data: this.load(), view: 'home', focus: false, cmd: '', cmdFocused: false,\n    capOpen: false, capValue: '', why: false, todayOpen: false, decOpen: false,\n    dump: '', askValue: '', filter: 'open', query: '', tomorrow: '', clearDump: '',\n    form: null, toast: '', ci: {}, wt: null,\n    pmode: 'capture', pval: ''\n  };\n\n  submitPrompt() {\n    const v = String(this.state.pval || '').trim();\n    if (!v) return;\n    if (this.state.pmode === 'ask') { this.ask(v); this.setState({ pval: '' }); return; }\n    const n = this.capture(v);\n    this.setState({ pval: '' });\n    if (n) this.flash(n > 1 ? `Captured ${n} items` : 'Captured');\n  }\n\n  wtSteps() {\n    return [\n      { time: 'STEP 1', title: 'Dump everything first', body: 'Open Capture and type one line per item. Meetings, follow-ups, the thing you keep forgetting. Do not sort, do not judge, do not decide yet.',\n        tip: 'Shortcut: \\u2318/Ctrl + Shift + Space from any screen. Enter files the line and keeps the box open.',\n        run: () => this.setState({ view: 'capture', focus: false, why: false, capOpen: false, form: null }) },\n      { time: 'STEP 2', title: 'Name your projects', body: 'Before triaging, add the 3 or 4 buckets your work actually rolls up to. Each project gets one Next line \\u2014 the single move that advances it.',\n        tip: 'Keep it to four. If everything is a project, nothing is.',\n        run: () => this.setState({ view: 'projects', focus: false }) },\n      { time: 'STEP 3', title: 'Triage the inbox', body: 'Now go back and give each captured line one tap: Today, Next, Waiting, or Note. Capturing and prioritizing at the same time is what makes lists feel heavy \\u2014 keep them separate.',\n        tip: 'Waiting is for anything you cannot move without another person. Name who.',\n        run: () => this.setState({ view: 'capture', focus: false }) },\n      { time: 'STEP 4', title: 'Load Today with about six', body: 'Six items, but only two that truly must move. The rest is queue. If everything is Today, the screen stops telling you anything.',\n        tip: 'Combine same-shape chores \\u2014 ticket updates and system cleanup are one slot, not two.',\n        run: () => this.setState({ view: 'today', focus: false }) },\n      { time: 'STEP 5', title: 'Set the NOW card', body: 'Pick the one task that unlocks the most downstream work, not the easiest win. Use \"Something else\" under NOW to name it in your own words.',\n        tip: 'Good test: which task, if finished, would let you answer a question you currently cannot?',\n        run: () => this.setState({ view: 'home', focus: false, why: true }) },\n      { time: 'STEP 6', title: 'Park the blockers', body: 'Anything waiting on someone else goes to Waiting with a name attached. It leaves your active list and appears in the right-hand rail as a nudge list.',\n        tip: 'Work the Waiting list late in the day, when interrupting people costs you the least focus.',\n        run: () => this.setState({ view: 'tasks', filter: 'waiting', focus: false }) },\n      { time: 'STEP 7', title: 'Work it in focus', body: 'Start now dims the wallpaper and hides counts, projects and the rail. One task lit, nothing else. New thoughts go to Capture, not into the plan.',\n        tip: 'Capture still works mid-focus. That is the point \\u2014 the plan stays stable while the day moves.',\n        run: () => this.setState({ view: 'home', focus: true }) },\n      { time: 'STEP 8', title: 'Close the day', body: 'Review what got done, what is still open, and name tomorrow\\u2019s first move. Close the day archives the whole board and leaves you blank.',\n        tip: 'You do not need every loose end finished. Unfinished work becomes an intentional Next or Waiting, not something you carry mentally.',\n        run: () => this.setState({ view: 'clear', focus: false }) }\n    ];\n  }\n  wtGo(i) {\n    const steps = this.wtSteps();\n    if (i < 0 || i >= steps.length) { this.setState({ wt: null }); return; }\n    this.setState({ wt: i });\n    steps[i].run();\n    window.scrollTo({ top: 0, behavior: 'smooth' });\n  }\n\n  componentDidMount() {\n    document.documentElement.dataset.theme = this.state.data.theme || 'light';\n    this.onKey = (e) => {\n      const mod = e.metaKey || e.ctrlKey;\n      if (mod && e.shiftKey && (e.code === 'Space' || e.key === ' ')) { e.preventDefault(); this.setState({ capOpen: true, capValue: '' }); return; }\n      if (mod && (e.key === 'k' || e.key === 'K')) { e.preventDefault(); const el = document.querySelector('input[aria-label=\"Ask, find, or capture anything\"]'); if (el) el.focus(); return; }\n      if (e.key === 'Escape') this.setState({ capOpen: false, form: null, cmdFocused: false });\n    };\n    window.addEventListener('keydown', this.onKey);\n  }\n  componentWillUnmount() { window.removeEventListener('keydown', this.onKey); }\n\n  save(d) { try { localStorage.setItem(this.KEY, JSON.stringify(d)); } catch (e) {} }\n  mutate(fn, extra) {\n    const d = this.state.data;\n    fn(d);\n    this.save(d);\n    this.setState(Object.assign({ data: Object.assign({}, d) }, extra || {}));\n  }\n  flash(msg) { this.setState({ toast: msg }); clearTimeout(this._t); this._t = setTimeout(() => this.setState({ toast: '' }), 1900); }\n\n  openTasks() { return this.state.data.tasks.filter(t => t.status !== 'Done'); }\n  bestTask() {\n    const d = this.iso();\n    return this.openTasks().slice().sort((a, b) =>\n      ((b.priority === 'High') - (a.priority === 'High')) ||\n      (((a.due && a.due <= d) ? 0 : 1) - ((b.due && b.due <= d) ? 0 : 1)) ||\n      ((a.status === 'Today' ? 0 : 1) - (b.status === 'Today' ? 0 : 1)))[0];\n  }\n  metaFor(t) {\n    const bits = [];\n    if (t.project) bits.push(t.project);\n    if (t.due) bits.push(t.due === this.iso() ? 'due today' : 'due ' + t.due);\n    if (t.waiting) bits.push('waiting on ' + t.waiting);\n    if (!bits.length) bits.push(t.status.toLowerCase());\n    return bits.join(' · ');\n  }\n  wrapTask(t) {\n    return {\n      id: t.id, title: t.title, meta: this.metaFor(t), done: t.status === 'Done', open: t.status !== 'Done',\n      high: t.priority === 'High' && t.status !== 'Done',\n      onToggle: () => this.mutate(d => { const x = d.tasks.find(y => y.id === t.id); x.status = x.status === 'Done' ? 'Next' : 'Done'; }),\n      onEdit: () => this.openForm('task', t.id),\n      onDelete: () => this.mutate(d => { d.tasks = d.tasks.filter(y => y.id !== t.id); }),\n      onPromote: () => this.mutate(d => { d.push.primary = t.title; d.pushDate = this.iso(); const x = d.tasks.find(y => y.id === t.id); if (x) x.status = 'Today'; }, { view: 'home' })\n    };\n  }\n\n  go(view) { this.setState({ view, cmdFocused: false, form: null, capOpen: false }); window.scrollTo({ top: 0, behavior: 'smooth' }); }\n\n  openForm(kind, id) {\n    const d = this.state.data;\n    let item;\n    if (kind === 'task') item = d.tasks.find(x => x.id === id) || { id: this.uid(), title: '', project: '', priority: 'Medium', status: 'Next', due: '', waiting: '', notes: '', created: this.iso() };\n    else if (kind === 'project') item = d.projects.find(x => x.id === id) || { id: this.uid(), name: '', status: 'Active', next: '', notes: '' };\n    else if (kind === 'decision') item = d.decisions.find(x => x.id === id) || { id: this.uid(), title: '', status: 'Open', date: this.iso(), notes: '' };\n    else item = { id: this.uid(), title: '', body: '', date: this.iso() };\n    this.setState({ form: { kind: kind, fresh: !id, item: Object.assign({}, item) } });\n  }\n  setF(key, value) {\n    const f = this.state.form;\n    this.setState({ form: { kind: f.kind, fresh: f.fresh, item: Object.assign({}, f.item, { [key]: value }) } });\n  }\n  saveForm() {\n    const f = this.state.form; if (!f) return;\n    const it = f.item;\n    const label = f.kind === 'project' ? (it.name || '').trim() : (it.title || '').trim();\n    if (!label) return;\n    this.mutate(d => {\n      if (f.kind === 'task') { it.title = label; const i = d.tasks.findIndex(x => x.id === it.id); if (i < 0) d.tasks.push(it); else d.tasks[i] = it; }\n      else if (f.kind === 'project') { it.name = label; const i = d.projects.findIndex(x => x.id === it.id); if (i < 0) d.projects.push(it); else d.projects[i] = it; }\n      else if (f.kind === 'decision') { it.title = label; const i = d.decisions.findIndex(x => x.id === it.id); if (i < 0) d.decisions.push(it); else d.decisions[i] = it; }\n      else { it.title = label; it.body = it.notes || it.body || ''; d.notes.push(it); }\n    }, { form: null });\n    this.flash('Saved');\n  }\n\n  capture(text) {\n    const lines = String(text || '').split(/\\n|[•;]/).map(x => x.trim().replace(/^[-*]\\s*/, '')).filter(Boolean);\n    if (!lines.length) return 0;\n    this.mutate(d => { lines.forEach(title => d.tasks.push({ id: this.uid(), title, project: '', priority: 'Medium', status: 'Inbox', due: '', waiting: '', notes: '', created: this.iso() })); });\n    return lines.length;\n  }\n\n  localAdvice(q) {\n    const l = q.toLowerCase(), d = this.iso(), open = this.openTasks(), best = this.bestTask();\n    const wait = open.filter(t => t.status === 'Waiting'), over = open.filter(t => t.due && t.due < d), high = open.filter(t => t.priority === 'High');\n    if (l.includes('organize') || l.includes('brain dump')) return 'Put it in Capture and send it to the inbox. Each line becomes one line you can triage with a single tap later. Do not classify while capturing.';\n    if (l.includes('forget')) return over.length ? `You may be forgetting ${over.length} overdue item${over.length > 1 ? 's' : ''}. Start with \"${over[0].title}.\"` : wait.length ? `Check the waiting list. \"${wait[0].title}\" is with ${wait[0].waiting || 'someone else'}. Decide whether it needs a nudge.` : 'Nothing obvious is missing. Check your calendar and messages once, then stop searching for hidden work.';\n    if (l.includes('rest of my day') || l.includes('plan')) return best ? `Do \"${best.title}\" first for 25 focused minutes. Then a short break, one waiting follow-up, and only then choose another action.` : 'Your list is clear. Use the next block to capture loose thoughts, then choose one small finish.';\n    if (l.includes('stop')) return high.length > 2 ? 'Stop treating every high-priority item as equally urgent. Pick one primary move and lower the rest for today.' : 'Stop reopening the whole system after you choose. Finish one useful piece before reorganizing again.';\n    if (l.includes('waiting')) return wait.length ? `You are waiting on ${wait.length} thing${wait.length > 1 ? 's' : ''}. The oldest is \"${wait[0].title}\" with ${wait[0].waiting || 'someone else'}.` : 'Nobody owes you anything right now.';\n    if (l.includes('next') || l.includes('should')) return best ? `My pick: ${best.title}. It is the clearest move with the most weight right now. Give it 25 minutes before checking anything else.` : 'Choose one small action you can fully finish in 15 minutes. The system does not need more organizing.';\n    return best ? `Based on what is here, I would protect \"${best.title}\" first. If your question is about a tradeoff, name the two choices and I will pick one.` : 'You have room to think. Tell me the two options you are weighing and I will give a direct opinion.';\n  }\n\n  async ask(q) {\n    q = String(q || '').trim(); if (!q) return;\n    this.mutate(d => { d.chats.push({ role: 'user', text: q }); d.chats.push({ role: 'ai', text: 'Thinking…' }); }, { view: 'ask', askValue: '' });\n    const s = this.state.data.settings || {};\n    let ans;\n    if (s.apiKey) {\n      try {\n        const summary = { push: this.state.data.push, openTasks: this.openTasks().slice(0, 20), projects: this.state.data.projects, waiting: this.state.data.tasks.filter(t => t.status === 'Waiting'), openDecisions: this.state.data.decisions.filter(x => x.status === 'Open') };\n        const r = await fetch(s.endpoint || 'https://api.openai.com/v1/responses', {\n          method: 'POST', headers: { 'Content-Type': 'application/json', Authorization: 'Bearer ' + s.apiKey },\n          body: JSON.stringify({ model: s.model || 'gpt-4.1-mini', instructions: 'You are Sierra\\u2019s calm Executive OS advisor. Simple conversational language, no project-management jargon. Give one best next move and a short reason.', input: `Current OS summary: ${JSON.stringify(summary)}\\n\\nSierra asks: ${q}` })\n        });\n        if (!r.ok) throw new Error('API ' + r.status);\n        const j = await r.json();\n        ans = j.output_text || (j.output || []).flatMap(o => o.content || []).map(c => c.text || '').join('') || 'I could not read the API response.';\n      } catch (e) { ans = `The online advisor did not connect (${e.message}). Here is the loca
