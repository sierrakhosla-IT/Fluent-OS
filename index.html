document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

002Fdiv>\n<\u002Fdiv>\n<div style=\"margin:28px 0 8px\"><div style=\"display:inline-flex;align-items:baseline;gap:10px;padding:7px 14px;border-radius:999px;background:var(--glass);backdrop-filter:var(--blur-sm);-webkit-backdrop-filter:var(--blur-sm);border:1px solid var(--glass-border)\">\n<h2 style=\"font-size:13px;font-weight:700;letter-spacing:.1em;color:var(--ink);margin:0\">INBOX<\u002Fh2>\n<span style=\"font-size:12.5px;color:var(--ink);opacity:.75\">{{ inboxCount }}<\u002Fspan>\n<\u002Fdiv><\u002Fdiv>\n<div style=\"display:flex;flex-direction:column;gap:8px\">\n<sc-for list=\"{{ inboxItems }}\" as=\"i\" hint-placeholder-count=\"3\">\n<div style=\"display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:13px 16px;background:var(--glass);backdrop-filter:var(--blur-sm);-webkit-backdrop-filter:var(--blur-sm);border:1px solid var(--glass-border);border-radius:var(--radius-md)\">\n<span style=\"flex:1;min-width:180px;font-size:14.5px\">{{ i.title }}<\u002Fspan>\n<div style=\"display:flex;gap:6px;flex-wrap:wrap\">\n<button sc-camel-on-click=\"{{ i.onToday }}\" style=\"border:1px solid var(--glass-border);background:var(--tintwarm);color:var(--deep);border-radius:9px;padding:7px 11px;font-size:12.5px;min-height:36px\" style-hover=\"filter:brightness(1.04)\">Today<\u002Fbutton>\n<button sc-camel-on-click=\"{{ i.onNext }}\" style=\"border:1px solid var(--glass-border);background:var(--glass-subtle);color:var(--ink2);border-radius:9px;padding:7px 11px;font-size:12.5px;min-height:36px\" style-hover=\"background:var(--glass-strong)\">Next<\u002Fbutton>\n<button sc-camel-on-click=\"{{ i.onWaiting }}\" style=\"border:1px solid var(--glass-border);background:var(--glass-subtle);color:var(--ink2);border-radius:9px;padding:7px 11px;font-size:12.5px;min-height:36px\" style-hover=\"background:var(--glass-strong)\">Waiting<\u002Fbutton>\n<button sc-camel-on-click=\"{{ i.onNote }}\" style=\"border:1px solid var(--glass-border);background:var(--glass-subtle);color:var(--ink2);border-radius:9px;padding:7px 11px;font-size:12.5px;min-height:36px\" style-hover=\"background:var(--glass-strong)\">Note<\u002Fbutton>\n<button sc-camel-on-click=\"{{ i.onDelete }}\" title=\"Discard\" style=\"border:0;background:transparent;color:var(--ink3);border-radius:9px;padding:7px 10px;min-height:36px\" style-hover=\"color:var(--deep)\">×<\u002Fbutton>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsc-for>\n<sc-if value=\"{{ noInbox }}\" hint-placeholder-val=\"{{ false }}\"><div style=\"padding:16px 0;color:var(--ink3);font-size:13.5px\">Inbox is empty.<\u002Fdiv><\u002Fsc-if>\n<\u002Fdiv>\n<\u002Fsection>\n<\u002Fsc-if>\n\n\n<sc-if value=\"{{ vAsk }}\" hint-placeholder-val=\"{{ false }}\">\n<section data-screen-label=\"Ask AI\">\n<h1 style=\"font-size:27px;letter-spacing:-.7px;margin:0 0 4px;font-weight:700\">Ask<\u002Fh1>\n<p style=\"margin:0 0 22px;color:var(--ink);opacity:.85\">Plain advice based on what is actually in here.<\u002Fp>\n<div data-two=\"\" style=\"display:grid;grid-template-columns:minmax(0,1fr) 280px;gap:16px;align-items:start\">\n<div style=\"padding:20px;background:var(--glass);backdrop-filter:var(--blur-md);-webkit-backdrop-filter:var(--blur-md);border:1px solid var(--glass-border);border-radius:var(--radius-lg);box-shadow:var(--shadow-soft);display:flex;flex-direction:column;min-height:460px\">\n<div style=\"display:flex;flex-direction:column;gap:10px;flex:1;overflow:auto;max-height:56vh\">\n<sc-for list=\"{{ messages }}\" as=\"m\" hint-placeholder-count=\"2\">\n<sc-if value=\"{{ m.isUser }}\" hint-placeholder-val=\"{{ false }}\">\n<div style=\"align-self:flex-end;max-width:82%;padding:11px 14px;border-radius:14px 14px 4px 14px;background:var(--deep);color:#fff;white-space:pre-wrap;font-size:14px\">{{ m.text }}<\u002Fdiv>\n<\u002Fsc-if>\n<sc-if value=\"{{ m.isAi }}\" hint-placeholder-val=\"{{ true }}\">\n<div style=\"align-self:flex-start;max-width:86%;padding:11px 14px;border-radius:14px 14px 14px 4px;background:var(--glass-strong);border:1px solid var(--glass-border);white-space:pre-wrap;font-size:14px\">{{ m.text }}<\u002Fdiv>\n<\u002Fsc-if>\n<\u002Fsc-for>\n<\u002Fdiv>\n<div style=\"display:flex;gap:8px;border-top:1px solid var(--line);padding-top:14px;margin-top:14px\">\n<textarea value=\"{{ askValue }}\" sc-camel-on-change=\"{{ onAskInput }}\" sc-camel-on-key-down=\"{{ onAskKey }}\" rows=\"2\" placeholder=\"What's on your mind?\" aria-label=\"Ask a question\" style=\"flex:1;border:1px solid var(--glass-border);background:var(--field);border-radius:12px;padding:11px;outline:none;resize:none\"><\u002Ftextarea>\n<button sc-camel-on-click=\"{{ onSend }}\" style=\"border:0;background:var(--deep);color:#fff;border-radius:11px;padding:0 18px;font-size:13.5px;font-weight:600;min-height:44px;box-shadow:0 8px 20px var(--glow)\" style-hover=\"filter:brightness(1.05)\">Ask<\u002Fbutton>\n<\u002Fdiv>\n<\u002Fdiv>\n<div style=\"display:flex;flex-direction:column;gap:8px\">\n<sc-for list=\"{{ quickPrompts }}\" as=\"q\" hint-placeholder-count=\"5\">\n<button sc-camel-on-click=\"{{ q.onClick }}\" style=\"text-align:left;border:1px solid var(--glass-border);background:var(--glass);border-radius:var(--radius-md);padding:12px 14px;font-size:13.5px;color:var(--ink2);min-height:44px\" style-hover=\"background:var(--glass-strong);color:var(--deep)\">{{ q.label }}<\u002Fbutton>\n<\u002Fsc-for>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsection>\n<\u002Fsc-if>\n\n<sc-if value=\"{{ vReview }}\" hint-placeholder-val=\"{{ false }}\">\n<section data-screen-label=\"Review\">\n<div style=\"display:flex;align-items:flex-end;justify-content:space-between;gap:14px;flex-wrap:wrap\">\n<div>\n<h1 style=\"font-size:27px;letter-spacing:-.7px;margin:0 0 4px;font-weight:700\">Review<\u002Fh1>\n<p style=\"margin:0 0 6px;color:var(--ink);opacity:.85\">Three quick prompts. Not a journal you have to feed.<\u002Fp>\n<\u002Fdiv>\n<button sc-camel-on-click=\"{{ onAddNote }}\" style=\"border:0;background:var(--deep);color:#fff;border-radius:11px;padding:11px 16px;font-size:13.5px;font-weight:600;min-height:44px;box-shadow:0 8px 20px var(--glow)\" style-hover=\"filter:brightness(1.05)\">New note<\u002Fbutton>\n<\u002Fdiv>\n<p style=\"margin:0 0 22px;color:var(--ink2);font-size:13.5px;max-width:62ch\">Two or three lines each is plenty. Answers save to this device and stack up under History, so you can look back at what you said mattered and what actually happened. Saved notes live here too.<\u002Fp>\n<div data-two=\"\" style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:14px\">\n<sc-for list=\"{{ checkins }}\" as=\"c\" hint-placeholder-count=\"3\">\n<div style=\"padding:18px 20px;background:var(--glass);backdrop-filter:var(--blur-md);-webkit-backdrop-filter:var(--blur-md);border:1px solid var(--glass-border);border-radius:var(--radius-lg);box-shadow:var(--shadow-soft)\">\n<div style=\"font-size:11.5px;font-weight:700;letter-spacing:.12em;color:var(--ink3)\">{{ c.label }}<\u002Fdiv>\n<h3 style=\"margin:8px 0 4px;font-size:15.5px;font-weight:600\">{{ c.prompt }}<\u002Fh3>\n<p style=\"margin:0 0 12px;font-size:12.5px;color:var(--ink3)\">{{ c.example }}<\u002Fp>\n<textarea value=\"{{ c.value }}\" sc-camel-on-change=\"{{ c.onInput }}\" placeholder=\"{{ c.placeholder }}\" aria-label=\"Check-in\" style=\"width:100%;min-height:110px;border:1px solid var(--glass-border);background:var(--field);border-radius:var(--radius-md);padding:12px;outline:none\"><\u002Ftextarea>\n<button sc-camel-on-click=\"{{ c.onSave }}\" style=\"margin-top:10px;border:1px solid var(--glass-border);background:var(--glass-subtle);border-radius:10px;padding:9px 14px;font-size:13px;color:var(--ink2);min-height:40px\" style-hover=\"background:var(--glass-strong);color:var(--deep)\">Save<\u002Fbutton>\n<sc-if value=\"{{ c.saved }}\" hint-placeholder-val=\"{{ false }}\"><span style=\"margin-left:10px;font-size:12.5px;color:var(--ink3)\">{{ c.savedLabel }}<\u002Fspan><\u002Fsc-if>\n<\u002Fdiv>\n<\u002Fsc-for>\n<\u002Fdiv>\n<div style=\"margin:30px 0 10px\"><div style=\"display:inline-flex;align-items:baseline;gap:10px;padding:7px 14px;border-radius:999px;background:var(--glass);backdrop-filter:var(--blur-sm);-webkit-backdrop-filter:var(--blur-sm);border:1px solid var(--glass-border)\">\n<h2 style=\"font-size:13px;font-weight:700;letter-spacing:.1em;color:var(--ink);margin:0\">HISTORY<\u002Fh2>\n<\u002Fdiv><\u002Fdiv>\n<div style=\"display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px\">\n<sc-for list=\"{{ reviewEntries }}\" as=\"j\" hint-placeholder-count=\"2\">\n<article style=\"padding:18px 20px;background:var(--glass-subtle);border:1px solid var(--glass-border);border-radius:var(--radius-lg)\">\n<div style=\"font-size:11.5px;letter-spacing:.1em;font-weight:700;color:var(--ink3)\">{{ j.date }}<\u002Fdiv>\n<h3 style=\"margin:7px 0 6px;font-size:15px;font-weight:600\">{{ j.title }}<\u002Fh3>\n<p style=\"margin:0;color:var(--ink2);font-size:13.5px;white-space:pre-wrap\">{{ j.body }}<\u002Fp>\n<sc-if value=\"{{ j.isNote }}\" hint-placeholder-val=\"{{ false }}\">\n<button sc-camel-on-click=\"{{ j.onDelete }}\" style=\"margin-top:10px;border:0;background:transparent;color:var(--ink3);font-size:12.5px;padding:4px 0\" style-hover=\"color:var(--deep)\">Delete note<\u002Fbutton>\n<\u002Fsc-if>\n<\u002Farticle>\n<\u002Fsc-for>\n<sc-if value=\"{{ noEntries }}\" hint-placeholder-val=\"{{ false }}\"><div style=\"padding:18px 0;color:var(--ink3);font-size:13.5px\">History starts when something is worth keeping.<\u002Fdiv><\u002Fsc-if>\n<\u002Fdiv>\n<\u002Fsection>\n<\u002Fsc-if>\n\n<sc-if value=\"{{ vClear }}\" hint-placeholder-val=\"{{ false }}\">\n<section data-screen-label=\"Clear Day\" style=\"max-width:1080px\">\n<h1 style=\"font-size:29px;letter-spacing:-.8px;margin:0 0 4px;font-weight:700\">Clear the day<\u002Fh1>\n<p style=\"margin:0 0 24px;color:var(--ink);opacity:.85\">Close the loops, name tomorrow's first move, and stop carrying it.<\u002Fp>\n<div style=\"padding:26px 28px;background:var(--glass-strong);backdrop-filter:var(--blur-lg);-webkit-backdrop-filter:var(--blur-lg);border:1px solid var(--glass-border);border-radius:var(--radius-lg);box-shadow:inset 0 1px 0 rgba(255,255,255,.6),var(--shadow-lift)\">\n<div data-two=\"\" style=\"display:grid;grid-template-columns:1fr 1fr;gap:26px\">\n<div>\n<div style=\"font-size:11.5px;font-weight:700;letter-spacing:.13em;color:var(--good)\">DONE TODAY<\u002Fdiv>\n<div style=\"margin-top:10px;display:flex;flex-direction:column;gap:7px\">\n<sc-for list=\"{{ doneToday }}\" as=\"t\" hint-placeholder-count=\"2\"><div style=\"font-size:13.5px;color:var(--ink2)\">{{ t.title }}<\u002Fdiv><\u002Fsc-for>\n<sc-if value=\"{{ noDoneToday }}\" hint-placeholder-val=\"{{ false }}\"><div style=\"font-size:13.5px;color:var(--ink3)\">Nothing checked off yet.<\u002Fdiv><\u002Fsc-if>\n<\u002Fdiv>\n<div style=\"font-size:11.5px;font-weight:700;letter-spacing:.13em;color:var(--ink2);margin-top:22px\">STILL OPEN<\u002Fdiv>\n<div style=\"margin-top:10px;display:flex;flex-direction:column;gap:7px\">\n<sc-for list=\"{{ stillOpen }}\" as=\"t\" hint-placeholder-count=\"3\"><div style=\"font-size:13.5px;color:var(--ink2)\">{{ t.title }}<\u002Fdiv><\u002Fsc-for>\n<sc-if value=\"{{ noStillOpen }}\" hint-placeholder-val=\"{{ false }}\"><div style=\"font-size:13.5px;color:var(--ink3)\">Nothing open.<\u002Fdiv><\u002Fsc-if>\n<\u002Fdiv>\n<div style=\"font-size:11.5px;font-weight:700;letter-spacing:.13em;color:var(--ink2);margin-top:22px\">WAITING<\u002Fdiv>\n<div style=\"margin-top:10px;display:flex;flex-direction:column;gap:7px\">\n<sc-for list=\"{{ waitingList }}\" as=\"t\" hint-placeholder-count=\"2\"><div style=\"font-size:13.5px;color:var(--ink2)\">{{ t.title }}<\u002Fdiv><\u002Fsc-for>\n<sc-if value=\"{{ noWaitingList }}\" hint-placeholder-val=\"{{ false }}\"><div style=\"font-size:13.5px;color:var(--ink3)\">No external dependencies.<\u002Fdiv><\u002Fsc-if>\n<\u002Fdiv>\n<\u002Fdiv>\n<div>\n<label style=\"display:block;font-size:11.5px;font-weight:700;letter-spacing:.13em;color:var(--deep)\">TOMORROW · FIRST MOVE<\u002Flabel>\n<input value=\"{{ tomorrow }}\" sc-camel-on-change=\"{{ onTomorrow }}\" placeholder=\"One specific action\" style=\"width:100%;margin-top:10px;border:1px solid var(--glass-border);background:var(--field);border-radius:var(--radius-md);padding:13px 14px;outline:none;font-size:15px\">\n<label style=\"display:block;font-size:11.5px;font-weight:700;letter-spacing:.13em;color:var(--ink2);margin-top:22px\">BRAIN DUMP<\u002Flabel>\n<textarea value=\"{{ clearDump }}\" sc-camel-on-change=\"{{ onClearDump }}\" placeholder=\"Anything still taking up space\" style=\"width:100%;margin-top:10px;min-height:150px;border:1px solid var(--glass-border);background:var(--field);border-radius:var(--radius-md);padding:13px 14px;outline:none\"><\u002Ftextarea>\n<\u002Fdiv>\n<\u002Fdiv>\n<button sc-camel-on-click=\"{{ onCloseDay }}\" style=\"width:100%;margin-top:26px;border:0;background:var(--deep);color:#fff;border-radius:13px;padding:15px;font-size:15.5px;font-weight:600;min-height:52px;box-shadow:0 12px 28px var(--glow)\" style-hover=\"filter:brightness(1.05)\">Close the day<\u002Fbutton>\n<p style=\"margin:12px 0 0;font-size:12.5px;color:var(--ink3);text-align:center\">Completed work is archived and today's board is cleared. Anything unfinished moves to Next — nothing is deleted.<\u002Fp>\n<div style=\"margin-top:18px;padding-top:18px;border-top:1px solid var(--line);display:flex;flex-direction:column;align-items:center;gap:8px\">\n<button sc-camel-on-click=\"{{ onClearOnly }}\" style=\"border:1px solid var(--glass-border);background:var(--glass-subtle);color:var(--ink2);border-radius:13px;padding:13px 20px;font-size:14px;font-weight:600;min-height:48px\" style-hover=\"background:var(--glass-strong)\">Just clear the board<\u002Fbutton>\n<p style=\"margin:0;font-size:12.5px;color:var(--ink3);text-align:center;max-width:44ch\">No archive entry, no review note, and tomorrow's first move stays as it is. Unfinished work still moves to Next.<\u002Fp>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsection>\n<\u002Fsc-if>\n\n<sc-if value=\"{{ vSettings }}\" hint-placeholder-val=\"{{ false }}\">\n<section data-screen-label=\"Settings\" style=\"max-width:820px\">\n<h1 style=\"font-size:27px;letter-spacing:-.7px;margin:0 0 4px;font-weight:700\">Settings<\u002Fh1>\n<p style=\"margin:0 0 22px;color:var(--ink);opacity:.85\">Your data stays in this browser unless you export it.<\u002Fp>\n<div style=\"padding:22px;background:var(--glass);backdrop-filter:var(--blur-md);-webkit-backdrop-filter:var(--blur-md);border:1px solid var(--glass-border);border-radius:var(--radius-lg);box-shadow:var(--shadow-soft);display:flex;flex-direction:column;gap:14px\">\n<label style=\"display:block\"><span style=\"font-size:13px;color:var(--ink2)\">OpenAI API key · optional<\u002Fspan><input type=\"password\" value=\"{{ apiKey }}\" sc-camel-on-change=\"{{ onApiKey }}\" placeholder=\"Stored only in this browser\" style=\"width:100%;margin-top:6px;border:1px solid var(--glass-border);background:var(--field);border-radius:10px;padding:11px;outline:none\"><\u002Flabel>\n<p style=\"margin:0;font-size:12.5px;color:var(--ink3)\">Without a key the built-in local advisor still works offline. With a key, your question and a brief summary of your data are sent from this browser to OpenAI.<\u002Fp>\n<div style=\"display:flex;gap:8px;flex-wrap:wrap\">\n<button sc-camel-on-click=\"{{ onSaveSettings }}\" style=\"border:0;background:var(--deep);color:#fff;border-radius:11px;padding:11px 16px;font-size:13.5px;font-weight:600;min-height:44px\" style-hover=\"filter:brightness(1.05)\">Save settings<\u002Fbutton>\n<button sc-camel-on-click=\"{{ onExport }}\" style=\"border:1px solid var(--glass-border);background:var(--glass-subtle);border-radius:11px;padding:11px 16px;font-size:13.5px;color:var(--ink2);min-height:44px\" style-hover=\"background:var(--glass-strong)\">Export backup<\u002Fbutton>\n<label style=\"border:1px solid var(--glass-border);background:var(--glass-subtle);border-radius:11px;padding:12px 16px;font-size:13.5px;color:var(--ink2);min-height:44px;cursor:pointer\">Import backup<input type=\"file\" accept=\"application/json\" sc-camel-on-change=\"{{ onImport }}\" style=\"display:none\"><\u002Flabel>\n<button sc-camel-on-click=\"{{ onReset }}\" style=\"border:1px solid var(--ring);background:var(--tintwarm);color:var(--deep);border-radius:11px;padding:11px 16px;font-size:13.5px;min-height:44px\" style-hover=\"filter:brightness(1.03)\">Reset starter data<\u002Fbutton>\n<\u002Fdiv>\n<div style=\"border-top:1px solid var(--line);padding-top:14px;font-size:12.5px;color:var(--ink3)\">{{ lastOpenedLabel }} · quick capture is ⌘/Ctrl + Shift + Space<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsection>\n<\u002Fsc-if>\n\n<\u002Fdiv>\n<\u002Fmain>\n<\u002Fdiv>\n\n<sc-if value=\"{{ capOpen }}\" hint-placeholder-val=\"{{ false }}\">\n<div sc-camel-on-click=\"{{ closeCapture }}\" style=\"position:fixed;inset:0;background:var(--scrim);backdrop-filter:blur(3px);z-index:60;display:flex;align-items:flex-start;justify-content:center;padding:14vh 20px 20px\">\n<div sc-camel-on-click=\"{{ stop }}\" style=\"width:min(620px,100%);padding:20px;background:var(--glass-strong);backdrop-filter:var(--blur-lg);-webkit-backdrop-filter:var(--blur-lg);border:1px solid var(--glass-border);border-radius:var(--radius-lg);box-shadow:var(--shadow-lift)\">\n<div style=\"display:flex;align-items:center;gap:9px;margin-bottom:12px\">\n<span style=\"width:7px;height:7px;border-radius:50%;background:var(--coral)\"><\u002Fspan>\n<span style=\"font-size:11.5px;font-weight:700;letter-spacing:.13em;color:var(--deep)\">QUICK CAPTURE<\u002Fspan>\n<span style=\"margin-left:auto;font-size:11.5px;color:var(--ink3)\">Enter to save · Esc to close<\u002Fspan>\n<\u002Fdiv>\n<textarea value=\"{{ capValue }}\" sc-camel-on-change=\"{{ onCapInput }}\" sc-camel-on-key-down=\"{{ onCapKey }}\" sc-camel-auto-focus=\"{{ true }}\" lid var(--glass-border);background:var(--field);border-radius:10px;padding:11px;outline:none\">\n<\u002Fdiv>\n<\u002Fsc-if>\n<sc-if value=\"{{ fIsProject }}\" hint-placeholder-val=\"{{ false }}\">\n<div data-two=\"\" style=\"display:grid;grid-template-columns:1fr 1fr;gap:10px\">\n<sc-raw-select value=\"{{ fStatus }}\" sc-camel-on-change=\"{{ onFStatus }}\" aria-label=\"Status\" style=\"border:1px solid var(--glass-border);background:var(--field);border-radius:10px;padding:11px;outline:none\">\n<option value=\"Active\">Active<\u002Foption><option value=\"On track\">On track<\u002Foption><option value=\"Needs attention\">Needs attention<\u002Foption><option value=\"Paused\">Paused<\u002Foption><option value=\"Complete\">Complete<\u002Foption>\n<\u002Fsc-raw-select>\n<input value=\"{{ fNext }}\" sc-camel-on-change=\"{{ onFNext }}\" placeholder=\"Next move\" aria-label=\"Next move\" style=\"border:1px solid var(--glass-border);background:var(--field);border-radius:10px;padding:11px;outline:none\">\n<\u002Fdiv>\n<\u002Fsc-if>\n<sc-if value=\"{{ fIsDecision }}\" hint-placeholder-val=\"{{ false }}\">\n<sc-raw-select value=\"{{ fStatus }}\" sc-camel-on-change=\"{{ onFStatus }}\" aria-label=\"Status\" style=\"border:1px solid var(--glass-border);background:var(--field);border-radius:10px;padding:11px;outline:none\">\n<option value=\"Open\">Open<\u002Foption><option value=\"Made\">Made<\u002Foption><option value=\"Revisit\">Revisit<\u002Foption>\n<\u002Fsc-raw-select>\n<\u002Fsc-if>\n<textarea value=\"{{ fNotes }}\" sc-camel-on-change=\"{{ onFNotes }}\" placeholder=\"{{ fNotesPlaceholder }}\" aria-label=\"Details\" style=\"width:100%;min-height:96px;border:1px solid var(--glass-border);background:var(--field);border-radius:10px;padding:12px;outline:none\"><\u002Ftextarea>\n<\u002Fdiv>\n<div style=\"display:flex;justify-content:flex-end;gap:8px;margin-top:18px\">\n<button sc-camel-on-click=\"{{ closeForm }}\" style=\"border:1px solid var(--glass-border);background:var(--glass-subtle);border-radius:10px;padding:10px 15px;font-size:13.5px;color:var(--ink2);min-height:42px\">Cancel<\u002Fbutton>\n<button sc-camel-on-click=\"{{ onFormSave }}\" style=\"border:0;background:var(--deep);color:#fff;border-radius:10px;padding:10px 18px;font-size:13.5px;font-weight:600;min-height:42px\">Save<\u002Fbutton>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsc-if>\n\n\n<sc-if value=\"{{ hasToast }}\" hint-placeholder-val=\"{{ false }}\">\n<div style=\"position:fixed;right:22px;bottom:22px;z-index:70;padding:12px 18px;background:var(--glass-strong);backdrop-filter:var(--blur-lg);-webkit-backdrop-filter:var(--blur-lg);border:1px solid var(--glass-border);border-radius:12px;box-shadow:var(--shadow-lift);font-size:13.5px\">{{ toast }}<\u002Fdiv>\n<\u002Fsc-if>\n\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;greetingName&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Sierra&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Content&quot;},&quot;nextCount&quot;:{&quot;editor&quot;:&quot;int&quot;,&quot;default&quot;:2,&quot;min&quot;:1,&quot;max&quot;:3,&quot;tsType&quot;:&quot;number&quot;,&quot;section&quot;:&quot;Layout&quot;}}\">\nclass Component extends DCLogic {\n  KEY = 'sierra-executive-os-v3';\n  iso = () => new Date().toISOString().slice(0, 10);\n  uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);\n\n  seed() {\n    const d = this.iso(), u = this.uid;\n    return {version:1,theme:'light',lastOpened:d,streak:1,lastCleared:'',morningDate:'',pushDate:'',\n      settings:{apiKey:'',model:'gpt-4.1-mini',endpoint:'https://api.openai.com/v1/responses'},\n      push:{primary:'',secondary:'',next:''},\n      projects:[],\n      tasks:[],\n      decisions:[],\n      notes:[],\n      journal:[],checkins:{},archive:[],\n      chats:[{role:'ai',text:'I am here. Ask what to do next, what you might be missing, or paste a brain dump and I will help sort it.'}]};\n  }\n\n  load() {\n    let s = null;\n    try { s = JSON.parse(localStorage.getItem(this.KEY)); } catch (e) { s = null; }\n    if (!s || !s.tasks || !s.projects) s = this.seed();\n    s.settings = s.settings || {};\n    s.checkins = s.checkins || {};\n    s.chats = s.chats || [];\n    s.archive = s.archive || [];\n    s.journal = s.journal || [];\n    s.notes = s.notes || [];\n    s.decisions = s.decisions || [];\n    s.push = s.push || {primary:'',secondary:'',next:''};\n    const today = this.iso();\n    if (s.lastOpened !== today) {\n      const diff = Math.round((new Date(today) - new Date(s.lastOpened || today)) / 86400000);\n      s.streak = diff === 1 ? (s.streak || 0) + 1 : 1;\n      s.lastOpened = today;\n    }\n    return s;\n  }\n\n  state = {\n    data: this.load(), view: 'home', focus: false, cmd: '', cmdFocused: false,\n    capOpen: false, capValue: '', why: false, todayOpen: false, decOpen: false,\n    dump: '', askValue: '', filter: 'open', query: '', tomorrow: '', clearDump: '',\n    form: null, toast: '', ci: {}, startedAt: null,\n    pmode: 'capture', pval: ''\n  };\n\n  submitPrompt() {\n    const v = String(this.state.pval || '').trim();\n    if (!v) return;\n    if (this.state.pmode === 'ask') { this.ask(v); this.setState({ pval: '' }); return; }\n    const n = this.capture(v);\n    this.setState({ pval: '' });\n    if (n) this.flash(n > 1 ? `Captured ${n} items` : 'Captured');\n  }\n\n\n  componentDidMount() {\n    document.documentElement.dataset.theme = this.state.data.theme || 'light';\n    this.onKey = (e) => {\n      const mod = e.metaKey || e.ctrlKey;\n      if (mod && e.shiftKey && (e.code === 'Space' || e.key === ' ')) { e.preventDefault(); this.setState({ capOpen: true, capValue: '' }); return; }\n      if (mod && (e.key === 'k' || e.key === 'K')) { e.preventDefault(); const el = document.querySelector('input[aria-label=\"Ask, find, or capture anything\"]'); if (el) el.focus(); return; }\n      if (e.key === 'Escape') this.setState({ capOpen: false, form: null, cmdFocused: false });\n    };\n    window.addEventListener('keydown', this.onKey);\n  }\n  componentWillUnmount() { window.removeEventListener('keydown', this.onKey); }\n\n  save(d) { try { localStorage.setItem(this.KEY, JSON.stringify(d)); } catch (e) {} }\n  mutate(fn, extra) {\n    const d = this.state.data;\n    fn(d);\n    this.save(d);\n    this.setState(Object.assign({ data: Object.assign({}, d) }, extra || {}));\n  }\n  componentDidMount() { this._tick = setInterval(() => { if (this.state.startedAt) this.forceUpdate(); }, 1000); }\n  componentWillUnmount() { clearInterval(this._tick); clearInterval(this._t); }\n  flash(msg) { this.setState({ toast: msg }); clearTimeout(this._t); this._t = setTimeout(() => this.setState({ toast: '' }), 1900); }\n\n  openTasks() { return this.state.data.tasks.filter(t => t.status !== 'Done'); }\n  bestTask() {\n    const d = this.iso();\n    return this.openTasks().slice().sort((a, b) =>\n      ((b.priority === 'High') - (a.priority === 'High')) ||\n      (((a.due && a.due <= d) ? 0 : 1) - ((b.due && b.due <= d) ? 0 : 1)) ||\n      ((a.status === 'Today' ? 0 : 1) - (b.status === 'Today' ? 0 : 1)))[0];\n  }\n  daysSince(iso) {\n    if (!iso) return 0;\n    return Math.max(0, Math.round((new Date(this.iso()) - new Date(iso)) / 86400000));\n  }\n  ageLabel(iso) {\n    const n = this.daysSince(iso);\n    return n === 0 ? 'since today' : n === 1 ? '1 day' : n + ' days';\n  }\n  metaFor(t) {\n    const bits = [];\n    if (t.project) bits.push(t.project);\n    if (t.due) bits.push(t.due === this.iso() ? 'due today' : 'due ' + t.due);\n    if (t.status === 'Waiting') bits.push(`${this.ageLabel(t.waitingSince)} with ${t.waiting || 'someone else'}`);\n    else if (t.waiting) bits.push('waiting on ' + t.waiting);\n    if (!bits.length) bits.push(t.status.toLowerCase());\n    return bits.join(' · ');\n  }\n  wrapTask(t) {\n    return {\n      id: t.id, title: t.title, meta: this.metaFor(t), done: t.status ===
